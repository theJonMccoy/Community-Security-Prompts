<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTF-8 Attack Character Mapper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--s1:#0c1220;--s2:#111827;--s3:#1e293b;--tx:#e2e8f0;--t2:#94a3b8;--t3:#64748b;--t4:#475569;--ac:#a78bfa;--rd:#f87171;--am:#fbbf24;--gn:#4ade80;--bl:#60a5fa;--tl:#2dd4bf}
body{font-family:'IBM Plex Mono','Fira Code',ui-monospace,monospace;background:var(--bg);color:var(--tx);min-height:100vh;font-size:13px;line-height:1.6}

/* Header */
.header{padding:16px 24px;border-bottom:1px solid var(--s3);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:16px;font-weight:700;letter-spacing:-.02em}
.header h1 span{color:var(--rd)}
.header .stats{font-size:11px;color:var(--t3);margin-left:auto}

/* Layout */
.container{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 53px)}

/* Sidebar */
.sidebar{overflow-y:auto;border-right:1px solid var(--s3);padding:8px 0}
.group-btn{display:block;width:100%;text-align:left;padding:10px 16px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-family:inherit;font-size:12px;transition:all .1s;border-left:3px solid transparent}
.group-btn:hover{background:var(--s2);color:var(--tx)}
.group-btn.active{background:var(--s2);color:var(--tx);border-left-color:var(--ac)}
.group-btn .g-name{font-weight:600;display:block}
.group-btn .g-range{font-size:10px;color:var(--t3)}
.group-btn .g-badges{display:flex;gap:3px;margin-top:4px}
.g-badge{font-size:9px;padding:1px 5px;border-radius:3px;font-weight:600}
.g-badge.critical{background:rgba(248,113,113,.12);color:var(--rd)}
.g-badge.high{background:rgba(251,191,36,.1);color:var(--am)}
.g-badge.medium{background:rgba(96,165,250,.1);color:var(--bl)}
.g-badge.block{background:rgba(248,113,113,.08);color:var(--rd);border:1px solid rgba(248,113,113,.2)}
.g-badge.normalize{background:rgba(74,222,128,.08);color:var(--gn);border:1px solid rgba(74,222,128,.2)}
.g-badge.strip{background:rgba(251,191,36,.08);color:var(--am);border:1px solid rgba(251,191,36,.2)}

/* Main */
.main{overflow-y:auto;padding:20px 24px}
.group-header{margin-bottom:20px}
.group-header h2{font-size:18px;font-weight:700;margin-bottom:4px}
.group-header .gh-range{font-size:12px;color:var(--ac);margin-bottom:6px}
.group-header .gh-desc{font-size:12px;color:var(--t2);line-height:1.6;max-width:720px}
.group-header .gh-action{display:inline-block;margin-top:8px;font-size:10px;padding:2px 8px;border-radius:4px}

/* Char table */
.char-table{width:100%;border-collapse:collapse;font-size:12px}
.char-table th{text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);padding:8px 10px;border-bottom:2px solid var(--s3);font-weight:600;position:sticky;top:0;background:var(--bg);z-index:1}
.char-table td{padding:8px 10px;border-bottom:1px solid var(--s3);vertical-align:top}
.char-table tr{transition:background .08s}
.char-table tr:hover{background:var(--s2)}
.char-table tr.expanded{background:var(--s1)}

/* Char display */
.char-preview{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--s2);border:1px solid var(--s3);border-radius:4px;font-size:16px;font-family:inherit}
.char-preview.invisible{background:repeating-linear-gradient(45deg,var(--s2),var(--s2) 2px,var(--s3) 2px,var(--s3) 4px)}

/* Danger badge */
.danger{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
.danger.critical{background:rgba(248,113,113,.15);color:#fca5a5}
.danger.high{background:rgba(251,191,36,.12);color:#fde68a}
.danger.medium{background:rgba(96,165,250,.12);color:#93c5fd}
.danger.low{background:rgba(74,222,128,.1);color:#86efac}
.danger.safe{background:rgba(100,116,139,.1);color:var(--t2)}

/* Allow badge */
.allow-badge{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:600}
.allow-badge.yes{background:rgba(74,222,128,.1);color:var(--gn);border:1px solid rgba(74,222,128,.2)}
.allow-badge.no{background:rgba(248,113,113,.08);color:var(--rd);border:1px solid rgba(248,113,113,.2)}

/* Attack type */
.attack-type{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--s3);color:var(--t2)}

/* Expanded detail */
.char-detail{padding:12px 16px;background:var(--s1);border:1px solid var(--s3);border-radius:6px;margin:8px 0;font-size:11px;line-height:1.7}
.char-detail .cd-row{display:grid;grid-template-columns:100px 1fr;gap:4px;padding:2px 0}
.char-detail .cd-label{color:var(--t3);font-weight:600;text-transform:uppercase;font-size:9px;letter-spacing:.04em}

/* Search */
.search-bar{padding:8px 16px;border-bottom:1px solid var(--s3)}

/* Security mapping card */
.sec-map{margin:12px 0 20px;padding:14px 16px;background:var(--s1);border:1px solid var(--s3);border-radius:8px;font-size:11px;line-height:1.7}
.sec-map .sm-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ac);font-weight:700;margin-bottom:8px}
.sec-map .sm-row{display:flex;gap:8px;padding:3px 0;align-items:flex-start}
.sec-map .sm-label{width:90px;flex-shrink:0;color:var(--t3);font-weight:600;font-size:9px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px}
.sec-map .sm-val{color:var(--t2)}
.sm-chip{display:inline-block;font-size:9px;padding:1px 6px;border-radius:3px;margin:1px 2px;font-weight:600}
.sm-chip.ctrl{background:rgba(167,139,250,.1);color:var(--ac);border:1px solid rgba(167,139,250,.2)}
.sm-chip.risk{background:rgba(248,113,113,.08);color:var(--rd);border:1px solid rgba(248,113,113,.2)}
.sm-chip.ref{background:rgba(45,212,191,.08);color:var(--tl);border:1px solid rgba(45,212,191,.2)}
.sm-detect{font-family:inherit;font-size:10px;color:var(--tl);background:rgba(45,212,191,.06);padding:4px 8px;border-radius:4px;display:inline-block;margin-top:2px;word-break:break-all}
.search-bar input{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--s3);background:var(--s1);color:var(--tx);font-family:inherit;font-size:12px;outline:none}
.search-bar input:focus{border-color:var(--ac)}
.search-bar input::placeholder{color:var(--t4)}

/* Summary bar */
.summary-bar{display:flex;gap:16px;padding:12px 16px;border-bottom:1px solid var(--s3);font-size:11px;flex-wrap:wrap}
.summary-item{display:flex;align-items:center;gap:4px}
.summary-dot{width:8px;height:8px;border-radius:50%}

/* Welcome */
.welcome{display:flex;align-items:center;justify-content:center;height:100%;color:var(--t3);font-size:14px;text-align:center;padding:40px}
.welcome p{max-width:400px;line-height:1.8}

/* Mobile */
@media(max-width:768px){
  .container{grid-template-columns:1fr}
  .sidebar{max-height:200px;border-right:none;border-bottom:1px solid var(--s3)}
  .main{padding:12px 16px}
  .char-table{font-size:11px}
  .char-table th,.char-table td{padding:6px 6px}
}
</style>
</head>
<body>

<div class="header">
  <h1><span>UTF-8</span> Attack Character Mapper</h1>
  <div class="stats" id="stats"></div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="search-bar"><input type="text" id="search" placeholder="Search chars, names, attacks..."></div>

      <div class="summary-item"><div class="summary-dot" style="background:var(--gn)"></div><span id="s-low">0</span> low</div>

</div>

"danger":"low","attack":"combining","use_case":"Normal diacritic","allow":true,"note":"Allow 1-3, block stacking"},{"code":770,"hex":"U+0302","name":"COMBINING CIRCUMFLEX","danger":"low","attack":"combining","use_case":"Normal diacritic","allow":true,"note":"Allow 1-3, block stacking"},{"code":776,"hex":"U+0308","name":"COMBINING DIAERESIS","danger":"low","attack":"combining","use_case":"Normal umlaut diacritic","allow":true,"note":"Allow 1-3, block stacking"},{"code":817,"hex":"U+0331","name":"COMBINING MACRON BELOW","danger":"medium","attack":"combining","use_case":"Below-character mark - zalgo text ingredient","allow":true,"note":"Allow 1-3, block stacking"},{"code":856,"hex":"U+0358","name":"COMBINING DOT ABOVE RIGHT","danger":"medium","attack":"combining","use_case":"Stacking combiner for visual noise","allow":true,"note":"Allow 1-3, block stacking"}],"security_mapping":{"controls":["ctrl.inp.004","ctrl.inp.007"],"risks":["risk.prompt_injection","risk.adversarial_evasion"],"aisvs_refs":["2.1.4","2.2.1"],"sanitize_action":"NFC normalization + limit combining marks to max 3 per base char. >3 consecutive combiners (regex /\\p{M}{4,}/gu) = zalgo attack. Perplexity check on resulting token sequence.","detection":"regex: /\\p{M}{4,}/gu (4+ consecutive combining marks = zalgo)","research":{"hallucination":"Improbable bigrams from combining chars show 340% higher hallucination rate (Llama 3.1)"}}},{"id":"format_chars","name":"Format Characters","range":"Various","description":"Unicode format characters that affect text processing but have no visible glyph.","default_action":"block","chars":[{"code":8203,"hex":"U+200B","name":"ZERO WIDTH SPACE","danger":"critical","attack":"invisible","use_case":"Covered in invisible group","allow":false},{"code":8228,"hex":"U+2024","name":"ONE DOT LEADER","danger":"medium","attack":"homoglyph","use_case":"Looks like period - file extension spoofing","allow":false,"latin_equiv":"."},{"code":12644,"hex":"U+3164","name":"HANGUL FILLER","danger":"high","attack":"invisible","use_case":"Invisible Korean filler character - hidden content","allow":false},{"code":65440,"hex":"U+FFA0","name":"HALFWIDTH HANGUL FILLER","danger":"high","attack":"invisible","use_case":"Halfwidth invisible filler","allow":false},{"code":6068,"hex":"U+17B4","name":"KHMER VOWEL INHERENT AQ","danger":"high","attack":"invisible","use_case":"Invisible Khmer character - used in filter bypass","allow":false},{"code":6069,"hex":"U+17B5","name":"KHMER VOWEL INHERENT AA","danger":"high","attack":"invisible","use_case":"Invisible Khmer character","allow":false}],"security_mapping":{"controls":["ctrl.inp.004","ctrl.inp.007"],"risks":["risk.prompt_injection","risk.adversarial_evasion"],"aisvs_refs":["2.1.4","2.2.1"],"sanitize_action":"Strip all format characters. Includes Hangul fillers (invisible), Khmer inherent vowels (invisible).","detection":"regex: /[\\u2024\\u3164\\uFFA0\\u17B4\\u17B5]/g"}},{"id":"private_use","name":"Private Use Areas","range":"U+E000\u2013U+F8FF, U+F0000\u2013U+FFFFD","description":"Undefined by Unicode standard. Meaning is application-specific. Can carry hidden payloads or trigger undefined behavior.","default_action":"block","chars":[{"code":57344,"hex":"U+E000","name":"PRIVATE USE AREA START","danger":"high","attack":"undefined","use_case":"Application-defined meaning - unpredictable behavior across systems","allow":false},{"code":63743,"hex":"U+F8FF","name":"PRIVATE USE AREA END (Apple logo on macOS)","danger":"high","attack":"undefined","use_case":"Platform-specific rendering - may display as Apple logo or unknown glyph","allow":false},{"code":983040,"hex":"U+F0000","name":"SUPPLEMENTARY PRIVATE USE AREA-A","danger":"high","attack":"undefined","use_case":"Extended private use - large hidden data payloads","allow":false}],"security_mapping":{"controls":["ctrl.inp.004"],"risks":["risk.prompt_injection"],"aisvs_refs":["2.1.4"],"sanitize_action":"Block all private use area characters. Application-specific meaning = unpredictable behavior.","detection":"regex: /[\\uE000-\\uF8FF]/g plus supplementary PUA"}},{"id":"specials","name":"Specials Block","range":"U+FFF0\u2013U+FFFF","description":"Unicode specials including replacement character and noncharacters.","default_action":"block","chars":[{"code":65529,"hex":"U+FFF9","name":"INTERLINEAR ANNOTATION ANCHOR","danger":"high","attack":"invisible","use_case":"Invisible annotation - hidden metadata injection","allow":false},{"code":65530,"hex":"U+FFFA","name":"INTERLINEAR ANNOTATION SEPARATOR","danger":"high","attack":"invisible","use_case":"Hidden annotation separator","allow":false},{"code":65531,"hex":"U+FFFB","name":"INTERLINEAR ANNOTATION TERMINATOR","danger":"high","attack":"invisible","use_case":"Hidden annotation terminator","allow":false},{"code":65532,"hex":"U+FFFC","name":"OBJECT REPLACEMENT CHARACTER","danger":"high","attack":"injection","use_case":"Placeholder for embedded object - may trigger object loading","allow":false},{"code":65533,"hex":"U+FFFD","name":"REPLACEMENT CHARACTER","danger":"medium","attack":"encoding","use_case":"Encoding error marker - indicates upstream encoding attack attempt","allow":true,"note":"Presence indicates encoding issue"},{"code":65534,"hex":"U+FFFE","name":"NONCHARACTER","danger":"critical","attack":"encoding","use_case":"Guaranteed noncharacter - must never appear in valid text, indicates manipulation","allow":false},{"code":65535,"hex":"U+FFFF","name":"NONCHARACTER","danger":"critical","attack":"encoding","use_case":"Guaranteed noncharacter","allow":false}],"security_mapping":{"controls":["ctrl.inp.004","ctrl.inp.007"],"risks":["risk.prompt_injection","risk.adversarial_evasion"],"aisvs_refs":["2.1.4","2.2.1"],"sanitize_action":"Block noncharacters (U+FFFE, U+FFFF) and annotation chars. Allow U+FFFD (replacement char) as encoding error indicator.","detection":"regex: /[\\uFFF9-\\uFFFC\\uFFFE\\uFFFF]/g"}}]};

// Stats
const allChars = DATA.groups.flatMap(g => g.chars);
document.getElementById('stats').textContent = `${DATA.groups.length} groups · ${allChars.length} chars · ${allChars.filter(c=>c.danger==='critical').length} critical · ${allChars.filter(c=>c.danger==='high').length} high`;
document.getElementById('s-crit').textContent = allChars.filter(c=>c.danger==='critical').length;
document.getElementById('s-high').textContent = allChars.filter(c=>c.danger==='high').length;
document.getElementById('s-med').textContent = allChars.filter(c=>c.danger==='medium').length;
document.getElementById('s-low').textContent = allChars.filter(c=>c.danger==='low').length;

// Render groups sidebar
const groupsEl = document.getElementById('groups');
DATA.groups.forEach(g => {
  const btn = document.createElement('button');
  btn.className = 'group-btn';
  const crit = g.chars.filter(c=>c.danger==='critical').length;
  const high = g.chars.filter(c=>c.danger==='high').length;
  const med = g.chars.filter(c=>c.danger==='medium').length;
  const actionClass = g.default_action==='block'?'block':g.default_action.includes('normalize')?'normalize':'strip';
  btn.innerHTML = `<span class="g-name">${g.name}</span><span class="g-range">${g.range} · ${g.chars.length} chars</span>
    <div class="g-badges">${crit?`<span class="g-badge critical">${crit} crit</span>`:''}${high?`<span class="g-badge high">${high} high</span>`:''}${med?`<span class="g-badge medium">${med} med</span>`:''}<span class="g-badge ${actionClass}">${g.default_action.replace('_',' ')}</span></div>`;
  btn.onclick = () => showGroup(g.id);
  groupsEl.appendChild(btn);
});

// Show group
let activeGroup = null;
function showGroup(id) {
  activeGroup = id;
  document.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active'));
  const idx = DATA.groups.findIndex(g => g.id === id);
  groupsEl.children[idx].classList.add('active');
  const g = DATA.groups[idx];
  const main = document.getElementById('main');

  const actionClass = g.default_action==='block'?'block':g.default_action.includes('normalize')?'normalize':'strip';

  let h = `<div class="group-header">
    <h2>${g.name}</h2>
    <div class="gh-range">${g.range}</div>
    <div class="gh-desc">${g.description}</div>
    <span class="gh-action g-badge ${actionClass}">Default: ${g.default_action.replace(/_/g,' ')}</span>
  </div>`;

  // Security mapping
  const sm = g.security_mapping;
  if (sm) {
    const ctrlNames = {
      'ctrl.inp.001':'Prompt injection classifier','ctrl.inp.004':'Character set allow-list',
      'ctrl.inp.005':'Third-party content sanitization','ctrl.inp.007':'Pre-tokenization normalization',
      'ctrl.out.001':'Output schema enforcement','ctrl.ad.001':'Alignment test suite'
    };
    const riskNames = {
      'risk.prompt_injection':'Prompt injection & jailbreak',
      'risk.adversarial_evasion':'Adversarial evasion & robustness failure',
      'risk.data_disclosure':'Sensitive data leakage & privacy violation'
    };
    h += `<div class="sec-map">
      <div class="sm-title">AISVS Security Control Mapping</div>
      <div class="sm-row"><span class="sm-label">Controls</span><span class="sm-val">${sm.controls.map(c=>`<span class="sm-chip ctrl" title="${ctrlNames[c]||c}">${c}</span>`).join(' ')}</span></div>
      <div class="sm-row"><span class="sm-label">Risks</span><span class="sm-val">${sm.risks.map(r=>`<span class="sm-chip risk">${riskNames[r]||r}</span>`).join(' ')}</span></div>
      <div class="sm-row"><span class="sm-label">AISVS Refs</span><span class="sm-val">${sm.aisvs_refs.map(r=>`<span class="sm-chip ref">${r}</span>`).join(' ')}</span></div>
      <div class="sm-row"><span class="sm-label">Sanitize</span><span class="sm-val">${sm.sanitize_action}</span></div>
      <div class="sm-row"><span class="sm-label">Detection</span><span class="sm-val"><span class="sm-detect">${sm.detection}</span></span></div>
    </div>`;
  }

  h += `<table class="char-table"><thead><tr>
    <th>Char</th><th>Code</th><th>Name</th><th>Danger</th><th>Attack</th><th>Allow</th>
  </tr></thead><tbody>`;

  const searchQ = document.getElementById('search').value.toLowerCase();

  g.chars.forEach(c => {
    if (searchQ && !c.name.toLowerCase().includes(searchQ) && !c.hex.toLowerCase().includes(searchQ) && !c.attack.toLowerCase().includes(searchQ) && !c.use_case.toLowerCase().includes(searchQ)) return;

    const isInvisible = c.attack === 'invisible' || c.attack === 'control' || c.attack === 'bidi' || c.attack === 'encoding' || c.code < 32 || c.code === 127 || (c.code >= 128 && c.code <= 159);
    const charDisplay = isInvisible ? `<div class="char-preview invisible" title="Invisible/control character">&nbsp;</div>` : `<div class="char-preview">${c.code > 31 && c.code < 127 ? '&#'+c.code+';' : c.code > 159 && c.code < 65534 ? String.fromCodePoint(c.code) : '·'}</div>`;

    h += `<tr onclick="toggleDetail(this,'${c.hex}')">
      <td>${charDisplay}</td>
      <td style="font-size:11px;color:var(--ac)">${c.hex}<br><span style="color:var(--t3)">${c.code}</span></td>
      <td style="font-weight:500">${c.name}</td>
      <td><span class="danger ${c.danger}">${c.danger}</span></td>
      <td><span class="attack-type">${c.attack}</span></td>
      <td><span class="allow-badge ${c.allow?'yes':'no'}">${c.allow?'allow':'block'}</span></td>
    </tr>
    <tr class="detail-row" style="display:none" id="det-${c.hex.replace('+','')}"><td colspan="6">
      <div class="char-detail">
        <div class="cd-row"><span class="cd-label">Use case</span><span>${c.use_case}</span></div>
        <div class="cd-row"><span class="cd-label">Codepoint</span><span>${c.hex} (decimal: ${c.code})</span></div>
        <div class="cd-row"><span class="cd-label">UTF-8 bytes</span><span>${getUtf8Bytes(c.code)}</span></div>
        <div class="cd-row"><span class="cd-label">Attack type</span><span>${c.attack}</span></div>
        <div class="cd-row"><span class="cd-label">Danger</span><span class="danger ${c.danger}">${c.danger}</span></div>
        <div class="cd-row"><span class="cd-label">Allow list</span><span class="allow-badge ${c.allow?'yes':'no'}">${c.allow?'Allow':'Block'}</span></div>
        ${c.latin_equiv?`<div class="cd-row"><span class="cd-label">Latin equiv</span><span style="font-size:16px">${c.latin_equiv} <span style="font-size:10px;color:var(--t3)">(U+${c.latin_equiv.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0')})</span></span></div>`:''}
        ${c.note?`<div class="cd-row"><span class="cd-label">Note</span><span style="color:var(--am)">${c.note}</span></div>`:''}
        <div class="cd-row"><span class="cd-label">Regex detect</span><span style="font-size:10px;color:var(--tl)">${getRegex(c)}</span></div>
      </div>
    </td></tr>`;
  });

  h += '</tbody></table>';
  main.innerHTML = h;
}

function toggleDetail(row, hex) {
  const id = 'det-' + hex.replace('+','');
  const det = document.getElementById(id);
  if (det) {
    const showing = det.style.display !== 'none';
    document.querySelectorAll('.detail-row').forEach(r => r.style.display = 'none');
    document.querySelectorAll('.char-table tr').forEach(r => r.classList.remove('expanded'));
    if (!showing) {
      det.style.display = '';
      row.classList.add('expanded');
    }
  }
}

function getUtf8Bytes(code) {
  if (code <= 0x7F) return `1 byte: 0x${code.toString(16).toUpperCase().padStart(2,'0')}`;
  if (code <= 0x7FF) return `2 bytes: 0x${((code>>6)|0xC0).toString(16).toUpperCase()} 0x${((code&0x3F)|0x80).toString(16).toUpperCase()}`;
  if (code <= 0xFFFF) return `3 bytes: 0x${((code>>12)|0xE0).toString(16).toUpperCase()} 0x${(((code>>6)&0x3F)|0x80).toString(16).toUpperCase()} 0x${((code&0x3F)|0x80).toString(16).toUpperCase()}`;
  return `4 bytes`;
}

function getRegex(c) {
  if (c.code <= 0xFFFF) return `/\\u${c.code.toString(16).padStart(4,'0')}/g`;
  return `/\\u{${c.code.toString(16)}}/gu`;
}

// Search
document.getElementById('search').addEventListener('input', () => {
  if (activeGroup) showGroup(activeGroup);
});
</script>
</body>
</html>
